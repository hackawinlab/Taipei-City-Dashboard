<svg width="100" height="60" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Male side (left, negative) -->
  <rect x="10" y="10" width="35" height="8" fill="#4B96FA" rx="2"/>
  <rect x="15" y="20" width="30" height="8" fill="#4B96FA" rx="2"/>
  <rect x="20" y="30" width="25" height="8" fill="#4B96FA" rx="2"/>
  <rect x="25" y="40" width="20" height="8" fill="#4B96FA" rx="2"/>
  
  <!-- Center line -->
  <line x1="50" y1="5" x2="50" y2="55" stroke="#888787" stroke-width="1"/>
  
  <!-- Female side (right, positive) -->
  <rect x="55" y="10" width="35" height="8" fill="#F1C40F" rx="2"/>
  <rect x="55" y="20" width="30" height="8" fill="#F1C40F" rx="2"/>
  <rect x="55" y="30" width="25" height="8" fill="#F1C40F" rx="2"/>
  <rect x="55" y="40" width="20" height="8" fill="#F1C40F" rx="2"/>
  
  <!-- Labels -->
  <text x="27" y="57" font-family="Arial" font-size="8" fill="#888787" text-anchor="middle">男</text>
  <text x="73" y="57" font-family="Arial" font-size="8" fill="#888787" text-anchor="middle">女</text>
</svg> 